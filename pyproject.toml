[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "python-backend-guidance"
version = "0.1.0"
description = "Framework-independent, verifiable Python backend guidance for coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-DOCS.md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]

[project.scripts]
python-backend-guidance = "python_backend_guidance.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pika>=1.3,<2",
    "PyJWT>=2.10,<3",
    "trustme>=1.2,<2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "pyrefly==1.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/python_backend_guidance"]

[tool.hatch.build.targets.wheel.force-include]
"skills/python-backend-guidance/SKILL.md" = "python_backend_guidance/SKILL.md"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "skills/python-backend-guidance/SKILL.md" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = ["contract(task): public behavioral contract shared with solution grading"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing_extensions".msg = "Use Python 3.12 stdlib typing."
"__future__.annotations".msg = "Use ordinary imports and narrow quoted forward references."
"typing.TYPE_CHECKING".msg = "Use ordinary runtime imports."
"typing.Any".msg = "Preserve contracts with generics, protocols, or validated boundary data."

[tool.pyrefly]
required-version = "==1.4.1"
python-version = "3.12"
project-includes = ["src/**/*.py", "examples/**/*.py", "tests/**/*.py", "evals/**/*.py", "stubs/**/*.pyi"]
search-path = ["stubs", "src", "."]
preset = "all"
check-unannotated-defs = true
